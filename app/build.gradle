plugins { id 'com.android.application' }

android {
    namespace 'com.example.signinginfooverride'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.signinginfooverride'
        minSdk 28
        targetSdk 35
        versionCode 20
        versionName '3.13'
        buildConfigField 'String', 'OVERRIDE_DIRECTORY', '"/sdcard/SignatureOverrides"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
