plugins { id 'com.android.application' }

android {
    namespace 'com.example.signinginfooverride'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.signinginfooverride'
        minSdk 28
        targetSdk 35
        versionCode 6
        versionName '2.2'
        buildConfigField 'String', 'CONFIG_PATH', '"/sdcard/SignatureOverrides/config.json"'
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes { release { minifyEnabled false } }
}
dependencies { compileOnly 'de.robv.android.xposed:api:82' }
